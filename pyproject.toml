[project]
name = "aegrys"
version = "0.1.0"
description = "Fully local voice assistant: streaming STT, local LLM, MCP tools, TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2",
    "onnxruntime>=1.20",
    "piper-tts>=1.8",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "numpy>=2.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dash = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
aegrys = "aegrys.cli:main"
aegrys-dash = "aegrys.web.server:main"

[tool.setuptools.packages.find]
include = ["aegrys*"]

[tool.setuptools.package-data]
"aegrys.web" = ["static/*"]
